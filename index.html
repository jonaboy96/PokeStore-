<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pokémon TCG Catálogo v1.0</title>
<style>
  :root {
    --bg-primary: #0d0d12;
    --bg-secondary: #1a1a24;
    --bg-tertiary: #252533;
    --accent: #ffcb05;
    --accent-2: #3b4cca;
    --text: #e8e8f0;
    --text-muted: #9a9aad;
    --border: #33334a;
    --danger: #e63946;
    --success: #2ecc71;
    --overlay-alpha: 0.88;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    min-height: 100%;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background-color: var(--bg-primary);
    color: var(--text);
  }

  body {
    background-size: cover;
    background-position: center;
    background-attachment: fixed;
    background-repeat: no-repeat;
    background-color: var(--bg-primary);
    min-height: 100vh;
    position: relative;
  }

  /* Overlay como div real */
  #bgOverlay {
    position: fixed;
    inset: 0;
    background: rgba(13, 13, 18, 0.88);
    z-index: 0;
    pointer-events: none;
    transition: background 0.3s;
  }

  .app {
    max-width: 1400px;
    margin: 0 auto;
    padding: 16px;
    position: relative;
    z-index: 1;
  }

  header {
    display: flex;
    flex-wrap: wrap;
    gap: 12px;
    align-items: center;
    justify-content: space-between;
    padding: 16px 0;
    border-bottom: 2px solid var(--border);
    margin-bottom: 20px;
  }

  h1 {
    font-size: 1.6rem;
    color: var(--accent);
    display: flex;
    align-items: center;
    gap: 10px;
  }

  h1 .version {
    font-size: 0.75rem;
    color: var(--text-muted);
    background: var(--bg-tertiary);
    padding: 3px 8px;
    border-radius: 10px;
    font-weight: normal;
  }

  .header-actions {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
  }

  button {
    font-family: inherit;
    cursor: pointer;
    border: none;
    border-radius: 8px;
    padding: 10px 16px;
    font-size: 0.9rem;
    font-weight: 600;
    transition: transform 0.15s, filter 0.15s, background 0.2s;
    color: white;
  }

  button:hover { filter: brightness(1.15); transform: translateY(-1px); }
  button:active { transform: translateY(0); }

  .btn-primary { background: var(--accent-2); }
  .btn-accent { background: var(--accent); color: #222; }
  .btn-danger { background: var(--danger); }
  .btn-ghost {
    background: var(--bg-tertiary);
    color: var(--text);
    border: 1px solid var(--border);
  }

  .btn-small { padding: 6px 10px; font-size: 0.8rem; }

  /* Filtros */
  .filters {
    background: var(--bg-secondary);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 16px;
    margin-bottom: 20px;
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
    gap: 12px;
  }

  .filter-group {
    display: flex;
    flex-direction: column;
    gap: 6px;
  }

  .filter-group label {
    font-size: 0.75rem;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    color: var(--text-muted);
    font-weight: 600;
  }

  input, select {
    font-family: inherit;
    font-size: 0.9rem;
    padding: 9px 12px;
    background: var(--bg-tertiary);
    border: 1px solid var(--border);
    border-radius: 8px;
    color: var(--text);
    outline: none;
    transition: border-color 0.2s;
    width: 100%;
  }

  input:focus, select:focus { border-color: var(--accent); }

  .price-range {
    display: flex;
    gap: 6px;
    align-items: center;
  }

  .price-range input { flex: 1; min-width: 0; }

  /* Grid de cartas */
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
    gap: 16px;
  }

  .card {
    background: var(--bg-secondary);
    border: 1px solid var(--border);
    border-radius: 12px;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    transition: transform 0.2s, border-color 0.2s;
  }

  .card:hover {
    transform: translateY(-4px);
    border-color: var(--accent);
  }

  .card-image {
    width: 100%;
    aspect-ratio: 3 / 4;
    background: var(--bg-tertiary);
    object-fit: cover;
    display: block;
  }

  .card-image-placeholder {
    width: 100%;
    aspect-ratio: 3 / 4;
    background: var(--bg-tertiary);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 3rem;
    color: var(--border);
  }

  .card-body {
    padding: 12px;
    display: flex;
    flex-direction: column;
    gap: 6px;
    flex: 1;
  }

  .card-name {
    font-weight: 700;
    font-size: 0.95rem;
    line-height: 1.3;
  }

  .card-category {
    display: inline-block;
    font-size: 0.7rem;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    font-weight: 700;
    padding: 3px 8px;
    border-radius: 6px;
    background: var(--accent-2);
    align-self: flex-start;
  }

  .card-rarity {
    font-size: 0.75rem;
    color: var(--text-muted);
  }

  .card-price {
    font-size: 1.1rem;
    font-weight: 800;
    color: var(--accent);
    margin-top: auto;
  }

  .card-actions {
    display: flex;
    gap: 6px;
    padding: 0 12px 12px;
  }

  .card-actions button { flex: 1; }

  /* Modal */
  .modal-overlay {
    position: fixed;
    inset: 0;
    background: rgba(0, 0, 0, 0.75);
    display: none;
    align-items: center;
    justify-content: center;
    padding: 16px;
    z-index: 1000;
    backdrop-filter: blur(4px);
  }

  .modal-overlay.active { display: flex; }

  .modal {
    background: var(--bg-secondary);
    border: 1px solid var(--border);
    border-radius: 16px;
    width: 100%;
    max-width: 520px;
    max-height: 92vh;
    overflow-y: auto;
    padding: 24px;
  }

  .modal h2 {
    margin-bottom: 16px;
    color: var(--accent);
    font-size: 1.3rem;
  }

  .form-group {
    display: flex;
    flex-direction: column;
    gap: 6px;
    margin-bottom: 14px;
  }

  .form-group label {
    font-size: 0.8rem;
    color: var(--text-muted);
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }

  .form-row {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
  }

  .image-upload {
    display: flex;
    flex-direction: column;
    gap: 10px;
    align-items: center;
    padding: 16px;
    background: var(--bg-tertiary);
    border: 2px dashed var(--border);
    border-radius: 12px;
    cursor: pointer;
    transition: border-color 0.2s;
  }

  .image-upload:hover { border-color: var(--accent); }

  .image-preview {
    width: 100%;
    max-width: 200px;
    aspect-ratio: 3 / 4;
    object-fit: cover;
    border-radius: 8px;
  }

  .modal-actions {
    display: flex;
    gap: 10px;
    justify-content: flex-end;
    margin-top: 20px;
    flex-wrap: wrap;
  }

  /* Estado vacío */
  .empty {
    text-align: center;
    padding: 60px 20px;
    color: var(--text-muted);
    grid-column: 1 / -1;
  }

  .empty-icon { font-size: 4rem; margin-bottom: 12px; opacity: 0.4; }

  .counter {
    font-size: 0.85rem;
    color: var(--text-muted);
    margin-bottom: 12px;
  }

  /* Toast */
  .toast {
    position: fixed;
    bottom: 24px;
    left: 50%;
    transform: translateX(-50%) translateY(100px);
    background: var(--bg-tertiary);
    border: 1px solid var(--accent);
    color: var(--text);
    padding: 12px 20px;
    border-radius: 10px;
    font-size: 0.9rem;
    font-weight: 600;
    z-index: 2000;
    transition: transform 0.3s;
    box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5);
  }

  .toast.show { transform: translateX(-50%) translateY(0); }
  .toast.error { border-color: var(--danger); }

  /* Scrollbar */
  ::-webkit-scrollbar { width: 10px; height: 10px; }
  ::-webkit-scrollbar-track { background: var(--bg-primary); }
  ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 5px; }
  ::-webkit-scrollbar-thumb:hover { background: var(--accent-2); }

  /* Responsive */
  @media (max-width: 640px) {
    h1 { font-size: 1.3rem; }
    .grid { grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 12px; }
    .form-row { grid-template-columns: 1fr; }
    .header-actions { width: 100%; }
    .header-actions button { flex: 1; }
    .modal { padding: 18px; }
  }
</style>
</head>
<body>

<div id="bgOverlay"></div>

<div class="app">
  <header>
    <h1>⚡ Catálogo Pokémon TCG <span class="version">v1.0</span></h1>
    <div class="header-actions">
      <button class="btn-ghost" id="btnSettings">⚙️ Fondo</button>
      <button class="btn-accent" id="btnAdd">+ Agregar Carta</button>
    </div>
  </header>

  <!-- Filtros -->
  <section class="filters">
    <div class="filter-group">
      <label>Buscar</label>
      <input type="text" id="filterSearch" placeholder="Nombre de la carta...">
    </div>

    <div class="filter-group">
      <label>Categoría</label>
      <select id="filterCategory">
        <option value="">Todas</option>
        <option value="Pokemon">Pokémon</option>
        <option value="Entrenador">Entrenador</option>
        <option value="Item">Item</option>
        <option value="Estadio">Estadio</option>
        <option value="Herramienta">Herramienta</option>
      </select>
    </div>

    <div class="filter-group">
      <label>Rareza</label>
      <select id="filterRarity">
        <option value="">Todas</option>
        <option value="Común">Común</option>
        <option value="Poco Común">Poco Común</option>
        <option value="Rara">Rara</option>
        <option value="Rara Holo">Rara Holo</option>
        <option value="Ultra Rara">Ultra Rara</option>
        <option value="Secreta">Secreta</option>
        <option value="Promo">Promo</option>
      </select>
    </div>

    <div class="filter-group">
      <label>Rango de Precio</label>
      <div class="price-range">
        <input type="number" id="filterPriceMin" placeholder="Min" min="0" step="0.01">
        <input type="number" id="filterPriceMax" placeholder="Max" min="0" step="0.01">
      </div>
    </div>

    <div class="filter-group" style="justify-content:flex-end;">
      <label>&nbsp;</label>
      <button class="btn-ghost" id="btnClearFilters">Limpiar filtros</button>
    </div>
  </section>

  <div class="counter" id="counter">0 cartas en el catálogo</div>

  <div class="grid" id="grid"></div>
</div>

<!-- Modal Agregar/Editar -->
<div class="modal-overlay" id="modalOverlay">
  <div class="modal">
    <h2 id="modalTitle">Agregar Carta</h2>
    <form id="cardForm">
      <input type="hidden" id="cardId">

      <div class="form-group">
        <label>Imagen</label>
        <div class="image-upload" id="imageUpload">
          <input type="file" id="cardImage" accept="image/*" style="display:none;">
          <img id="imagePreview" class="image-preview" style="display:none;" alt="Preview">
          <div id="imagePlaceholder" style="text-align:center;">
            <div style="font-size:2.5rem;">📷</div>
            <div style="font-size:0.85rem;color:var(--text-muted);margin-top:6px;">Toca para subir imagen</div>
          </div>
        </div>
      </div>

      <div class="form-group">
        <label>Nombre *</label>
        <input type="text" id="cardName" required maxlength="100">
      </div>

      <div class="form-row">
        <div class="form-group">
          <label>Categoría *</label>
          <select id="cardCategory" required>
            <option value="Pokemon">Pokémon</option>
            <option value="Entrenador">Entrenador</option>
            <option value="Item">Item</option>
            <option value="Estadio">Estadio</option>
            <option value="Herramienta">Herramienta</option>
          </select>
        </div>

        <div class="form-group">
          <label>Rareza *</label>
          <select id="cardRarity" required>
            <option value="Común">Común</option>
            <option value="Poco Común">Poco Común</option>
            <option value="Rara">Rara</option>
            <option value="Rara Holo">Rara Holo</option>
            <option value="Ultra Rara">Ultra Rara</option>
            <option value="Secreta">Secreta</option>
            <option value="Promo">Promo</option>
          </select>
        </div>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label>Precio (USD) *</label>
          <input type="number" id="cardPrice" step="0.01" min="0" required>
        </div>

        <div class="form-group">
          <label>Cantidad</label>
          <input type="number" id="cardQuantity" min="1" value="1">
        </div>
      </div>

      <div class="form-group">
        <label>Notas</label>
        <input type="text" id="cardNotes" maxlength="200">
      </div>

      <div class="modal-actions">
        <button type="button" class="btn-ghost" id="btnCancel">Cancelar</button>
        <button type="submit" class="btn-accent" id="btnSave">Guardar</button>
      </div>
    </form>
  </div>
</div>

<!-- Modal Configuración de Fondo -->
<div class="modal-overlay" id="settingsOverlay">
  <div class="modal">
    <h2>Configurar Fondo</h2>

    <div class="form-group">
      <label>URL de imagen de fondo</label>
      <input type="text" id="bgUrlInput" placeholder="https://ejemplo.com/imagen.jpg">
      <div style="font-size:0.75rem;color:var(--text-muted);margin-top:4px;">
        Pega una URL directa a una imagen (jpg, png, webp).
      </div>
    </div>

    <div class="form-group">
      <label>O subir archivo local</label>
      <input type="file" id="bgFileInput" accept="image/*">
    </div>

    <div class="form-group">
      <label>Opacidad del overlay: <span id="opacityValue">88</span>%</label>
      <input type="range" id="bgOpacity" min="0" max="100" value="88">
      <div style="font-size:0.75rem;color:var(--text-muted);margin-top:4px;">
        Más bajo = fondo más visible. Más alto = fondo más oscurecido.
      </div>
    </div>

    <div id="bgPreviewWrap" style="display:none;margin-bottom:14px;">
      <label style="font-size:0.8rem;color:var(--text-muted);font-weight:600;text-transform:uppercase;letter-spacing:0.5px;">Vista previa</label>
      <div style="margin-top:8px;width:100%;height:120px;border-radius:10px;background-size:cover;background-position:center;border:1px solid var(--border);" id="bgPreview"></div>
    </div>

    <div class="modal-actions">
      <button type="button" class="btn-danger" id="btnClearBg">Quitar fondo</button>
      <button type="button" class="btn-ghost" id="btnCancelSettings">Cerrar</button>
      <button type="button" class="btn-accent" id="btnSaveBg">Aplicar</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
// ============================================
// CONFIGURACIÓN INDEXEDDB
// ============================================
const DB_NAME = 'PokemonTCGCatalog';
const DB_VERSION = 1;
const STORE_CARDS = 'cards';
const STORE_SETTINGS = 'settings';

let db = null;

function openDB() {
  return new Promise((resolve, reject) => {
    const req = indexedDB.open(DB_NAME, DB_VERSION);

    req.onupgradeneeded = (e) => {
      const database = e.target.result;
      if (!database.objectStoreNames.contains(STORE_CARDS)) {
        const store = database.createObjectStore(STORE_CARDS, { keyPath: 'id', autoIncrement: true });
        store.createIndex('name', 'name', { unique: false });
        store.createIndex('category', 'category', { unique: false });
        store.createIndex('rarity', 'rarity', { unique: false });
        store.createIndex('price', 'price', { unique: false });
      }
      if (!database.objectStoreNames.contains(STORE_SETTINGS)) {
        database.createObjectStore(STORE_SETTINGS, { keyPath: 'key' });
      }
    };

    req.onsuccess = (e) => resolve(e.target.result);
    req.onerror = (e) => reject(e.target.error);
  });
}

function dbGetAll(storeName) {
  return new Promise((resolve, reject) => {
    const tx = db.transaction(storeName, 'readonly');
    const store = tx.objectStore(storeName);
    const req = store.getAll();
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
}

function dbAdd(storeName, data) {
  return new Promise((resolve, reject) => {
    const tx = db.transaction(storeName, 'readwrite');
    const store = tx.objectStore(storeName);
    const req = store.add(data);
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
}

function dbPut(storeName, data) {
  return new Promise((resolve, reject) => {
    const tx = db.transaction(storeName, 'readwrite');
    const store = tx.objectStore(storeName);
    const req = store.put(data);
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
}

function dbDelete(storeName, id) {
  return new Promise((resolve, reject) => {
    const tx = db.transaction(storeName, 'readwrite');
    const store = tx.objectStore(storeName);
    const req = store.delete(id);
    req.onsuccess = () => resolve();
    req.onerror = () => reject(req.error);
  });
}

function dbGet(storeName, key) {
  return new Promise((resolve, reject) => {
    const tx = db.transaction(storeName, 'readonly');
    const store = tx.objectStore(storeName);
    const req = store.get(key);
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
}

// ============================================
// ESTADO
// ============================================
let allCards = [];
let editingId = null;
let pendingImageData = null;
let pendingBgData = null; // Cambio pendiente para aplicar sólo al presionar "Aplicar"

// ============================================
// UTILIDADES
// ============================================
function showToast(msg, isError = false) {
  const toast = document.getElementById('toast');
  toast.textContent = msg;
  toast.className = 'toast show' + (isError ? ' error' : '');
  clearTimeout(toast._timer);
  toast._timer = setTimeout(() => toast.classList.remove('show'), 2500);
}

function formatPrice(n) {
  return '$' + Number(n).toFixed(2);
}

function escapeHtml(str) {
  const div = document.createElement('div');
  div.textContent = str ?? '';
  return div.innerHTML;
}

// ============================================
// RENDERIZADO
// ============================================
function renderCards(cards) {
  const grid = document.getElementById('grid');
  const counter = document.getElementById('counter');

  counter.textContent = `${cards.length} carta${cards.length !== 1 ? 's' : ''} mostrada${cards.length !== 1 ? 's' : ''} de ${allCards.length}`;

  if (cards.length === 0) {
    grid.innerHTML = `
      <div class="empty">
        <div class="empty-icon">🃏</div>
        <div>${allCards.length === 0 ? 'No hay cartas en el catálogo. ¡Agrega la primera!' : 'No se encontraron cartas con esos filtros.'}</div>
      </div>`;
    return;
  }

  grid.innerHTML = cards.map(card => `
    <div class="card" data-id="${card.id}">
      ${card.image
        ? `<img class="card-image" src="${card.image}" alt="${escapeHtml(card.name)}" loading="lazy">`
        : `<div class="card-image-placeholder">🃏</div>`}
      <div class="card-body">
        <div class="card-name">${escapeHtml(card.name)}</div>
        <span class="card-category">${escapeHtml(card.category)}</span>
        <div class="card-rarity">${escapeHtml(card.rarity)} · x${card.quantity || 1}</div>
        <div class="card-price">${formatPrice(card.price)}</div>
      </div>
      <div class="card-actions">
        <button class="btn-primary btn-small" onclick="editCard(${card.id})">Editar</button>
        <button class="btn-danger btn-small" onclick="confirmDelete(${card.id})">Eliminar</button>
      </div>
    </div>
  `).join('');
}

function applyFilters() {
  const search = document.getElementById('filterSearch').value.toLowerCase().trim();
  const category = document.getElementById('filterCategory').value;
  const rarity = document.getElementById('filterRarity').value;
  const priceMin = parseFloat(document.getElementById('filterPriceMin').value);
  const priceMax = parseFloat(document.getElementById('filterPriceMax').value);

  const filtered = allCards.filter(card => {
    if (search && !card.name.toLowerCase().includes(search)) return false;
    if (category && card.category !== category) return false;
    if (rarity && card.rarity !== rarity) return false;
    if (!isNaN(priceMin) && card.price < priceMin) return false;
    if (!isNaN(priceMax) && card.price > priceMax) return false;
    return true;
  });

  renderCards(filtered);
}

// ============================================
// CRUD
// ============================================
async function loadCards() {
  try {
    allCards = await dbGetAll(STORE_CARDS);
    allCards.sort((a, b) => a.name.localeCompare(b.name));
    applyFilters();
  } catch (err) {
    console.error(err);
    showToast('Error al cargar cartas', true);
  }
}

function openModal(card = null) {
  editingId = card ? card.id : null;
  pendingImageData = card ? card.image : null;

  document.getElementById('modalTitle').textContent = card ? 'Editar Carta' : 'Agregar Carta';
  document.getElementById('cardId').value = card ? card.id : '';
  document.getElementById('cardName').value = card ? card.name : '';
  document.getElementById('cardCategory').value = card ? card.category : 'Pokemon';
  document.getElementById('cardRarity').value = card ? card.rarity : 'Común';
  document.getElementById('cardPrice').value = card ? card.price : '';
  document.getElementById('cardQuantity').value = card ? (card.quantity || 1) : 1;
  document.getElementById('cardNotes').value = card ? (card.notes || '') : '';
  document.getElementById('cardImage').value = '';

  const preview = document.getElementById('imagePreview');
  const placeholder = document.getElementById('imagePlaceholder');

  if (pendingImageData) {
    preview.src = pendingImageData;
    preview.style.display = 'block';
    placeholder.style.display = 'none';
  } else {
    preview.style.display = 'none';
    placeholder.style.display = 'block';
  }

  document.getElementById('modalOverlay').classList.add('active');
}

function closeModal() {
  document.getElementById('modalOverlay').classList.remove('active');
  editingId = null;
  pendingImageData = null;
}

async function saveCard(e) {
  e.preventDefault();

  const cardData = {
    name: document.getElementById('cardName').value.trim(),
    category: document.getElementById('cardCategory').value,
    rarity: document.getElementById('cardRarity').value,
    price: parseFloat(document.getElementById('cardPrice').value),
    quantity: parseInt(document.getElementById('cardQuantity').value) || 1,
    notes: document.getElementById('cardNotes').value.trim(),
    image: pendingImageData || null
  };

  if (!cardData.name || isNaN(cardData.price)) {
    showToast('Completa los campos requeridos', true);
    return;
  }

  try {
    if (editingId) {
      cardData.id = editingId;
      await dbPut(STORE_CARDS, cardData);
      showToast('Carta actualizada ✓');
    } else {
      await dbAdd(STORE_CARDS, cardData);
      showToast('Carta agregada ✓');
    }
    closeModal();
    await loadCards();
  } catch (err) {
    console.error(err);
    showToast('Error al guardar', true);
  }
}

function editCard(id) {
  const card = allCards.find(c => c.id === id);
  if (card) openModal(card);
}

async function confirmDelete(id) {
  const card = allCards.find(c => c.id === id);
  if (!card) return;
  if (!confirm(`¿Eliminar "${card.name}" del catálogo?`)) return;

  try {
    await dbDelete(STORE_CARDS, id);
    showToast('Carta eliminada');
    await loadCards();
  } catch (err) {
    console.error(err);
    showToast('Error al eliminar', true);
  }
}

// ============================================
// IMAGEN DE CARTA
// ============================================
function handleImageUpload(file, callback) {
  if (!file) return;
  if (!file.type.startsWith('image/')) {
    showToast('El archivo debe ser una imagen', true);
    return;
  }
  if (file.size > 5 * 1024 * 1024) {
    showToast('La imagen no debe superar 5MB', true);
    return;
  }

  const reader = new FileReader();
  reader.onload = (e) => {
    const img = new Image();
    img.onload = () => {
      const canvas = document.createElement('canvas');
      const MAX = 600;
      let { width, height } = img;
      if (width > height && width > MAX) {
        height = (height * MAX) / width;
        width = MAX;
      } else if (height > MAX) {
        width = (width * MAX) / height;
        height = MAX;
      }
      canvas.width = width;
      canvas.height = height;
      const ctx = canvas.getContext('2d');
      ctx.drawImage(img, 0, 0, width, height);
      const compressed = canvas.toDataURL('image/jpeg', 0.85);
      callback(compressed);
    };
    img.src = e.target.result;
  };
  reader.readAsDataURL(file);
}

// ============================================
// FONDO
// ============================================
function applyBackgroundToDOM(imageData, opacityPct) {
  const body = document.body;

  if (imageData) {
    body.style.backgroundImage = `url("${imageData}")`;
    body.style.backgroundSize = 'cover';
    body.style.backgroundPosition = 'center';
    body.style.backgroundAttachment = 'fixed';
    body.style.backgroundRepeat = 'no-repeat';
  } else {
    body.style.backgroundImage = 'none';
  }

  const alpha = (opacityPct ?? 88) / 100;
  document.getElementById('bgOverlay').style.background = `rgba(13, 13, 18, ${alpha})`;
}

async function loadBackground() {
  try {
    const bg = await dbGet(STORE_SETTINGS, 'background');
    const opacityRec = await dbGet(STORE_SETTINGS, 'bgOpacity');
    const opacity = opacityRec ? opacityRec.value : 88;

    applyBackgroundToDOM(bg ? bg.value : null, opacity);

    // Rellenar el modal
    document.getElementById('bgOpacity').value = opacity;
    document.getElementById('opacityValue').textContent = opacity;

    if (bg && bg.value) {
      // Si es una URL http/https la mostramos en el input
      if (bg.value.startsWith('data:')) {
        document.getElementById('bgUrlInput').value = '';
        showPreview(bg.value);
      } else {
        document.getElementById('bgUrlInput').value = bg.value;
        showPreview(bg.value);
      }
    }
  } catch (err) {
    console.error('Error cargando fondo', err);
  }
}

function showPreview(src) {
  const wrap = document.getElementById('bgPreviewWrap');
  const preview = document.getElementById('bgPreview');
  if (src) {
    preview.style.backgroundImage = `url("${src}")`;
    wrap.style.display = 'block';
  } else {
    wrap.style.display = 'none';
    preview.style.backgroundImage = 'none';
  }
}

async function saveBackground() {
  try {
    const url = document.getElementById('bgUrlInput').value.trim();
    const opacity = parseInt(document.getElementById('bgOpacity').value);

    let finalImage = pendingBgData || url || null;

    // Si hay URL en el input, priorizamos el archivo pendiente si existe
    if (pendingBgData) {
      finalImage = pendingBgData;
    } else if (url) {
      finalImage = url;
    } else {
      // No hay ni archivo ni url: conservar el que ya está en DB
      const existing = await dbGet(STORE_SETTINGS, 'background');
      finalImage = existing ? existing.value : null;
    }

    if (finalImage) {
      await dbPut(STORE_SETTINGS, { key: 'background', value: finalImage });
    } else {
      await dbDelete(STORE_SETTINGS, 'background');
    }

    await dbPut(STORE_SETTINGS, { key: 'bgOpacity', value: opacity });

    applyBackgroundToDOM(finalImage, opacity);
    showToast('Fondo aplicado ✓');
    document.getElementById('settingsOverlay').classList.remove('active');
  } catch (err) {
    console.error(err);
    showToast('Error al guardar fondo: ' + err.message, true);
  }
}

async function clearBackground() {
  try {
    await dbDelete(STORE_SETTINGS, 'background');
    pendingBgData = null;
    document.getElementById('bgUrlInput').value = '';
    document.getElementById('bgFileInput').value = '';
    applyBackgroundToDOM(null, parseInt(document.getElementById('bgOpacity').value) || 88);
    showPreview(null);
    showToast('Fondo eliminado');
  } catch (err) {
    console.error(err);
    showToast('Error al quitar fondo', true);
  }
}

// ============================================
// EVENTOS
// ============================================
function initEvents() {
  document.getElementById('btnAdd').onclick = () => openModal();
  document.getElementById('btnCancel').onclick = closeModal;
  document.getElementById('cardForm').onsubmit = saveCard;

  document.getElementById('modalOverlay').onclick = (e) => {
    if (e.target.id === 'modalOverlay') closeModal();
  };
  document.getElementById('settingsOverlay').onclick = (e) => {
    if (e.target.id === 'settingsOverlay') {
      document.getElementById('settingsOverlay').classList.remove('active');
    }
  };

  // Imagen de carta
  document.getElementById('imageUpload').onclick = () => {
    document.getElementById('cardImage').click();
  };

  document.getElementById('cardImage').onchange = (e) => {
    handleImageUpload(e.target.files[0], (dataUrl) => {
      pendingImageData = dataUrl;
      const preview = document.getElementById('imagePreview');
      preview.src = dataUrl;
      preview.style.display = 'block';
      document.getElementById('imagePlaceholder').style.display = 'none';
    });
  };

  // Filtros
  document.getElementById('filterSearch').oninput = applyFilters;
  document.getElementById('filterCategory').onchange = applyFilters;
  document.getElementById('filterRarity').onchange = applyFilters;
  document.getElementById('filterPriceMin').oninput = applyFilters;
  document.getElementById('filterPriceMax').oninput = applyFilters;

  document.getElementById('btnClearFilters').onclick = () => {
    document.getElementById('filterSearch').value = '';
    document.getElementById('filterCategory').value = '';
    document.getElementById('filterRarity').value = '';
    document.getElementById('filterPriceMin').value = '';
    document.getElementById('filterPriceMax').value = '';
    applyFilters();
  };

  // Settings
  document.getElementById('btnSettings').onclick = () => {
    pendingBgData = null;
    document.getElementById('bgFileInput').value = '';
    document.getElementById('settingsOverlay').classList.add('active');
  };

  document.getElementById('btnCancelSettings').onclick = () => {
    pendingBgData = null;
    document.getElementById('bgFileInput').value = '';
    document.getElementById('settingsOverlay').classList.remove('active');
  };

  document.getElementById('btnSaveBg').onclick = saveBackground;
  document.getElementById('btnClearBg').onclick = clearBackground;

  // Opacidad en vivo (sólo visual dentro del modal, se guarda al Aplicar)
  document.getElementById('bgOpacity').oninput = (e) => {
    document.getElementById('opacityValue').textContent = e.target.value;
  };

  // URL input -> preview
  document.getElementById('bgUrlInput').oninput = (e) => {
    const url = e.target.value.trim();
    if (url) {
      pendingBgData = null;
      showPreview(url);
    } else {
      showPreview(pendingBgData);
    }
  };

  // Subir archivo de fondo
  document.getElementById('bgFileInput').onchange = (e) => {
    const file = e.target.files[0];
    if (!file) return;
    if (!file.type.startsWith('image/')) {
      showToast('Debe ser una imagen', true);
      return;
    }
    if (file.size > 8 * 1024 * 1024) {
      showToast('La imagen no debe superar 8MB', true);
      return;
    }

    const reader = new FileReader();
    reader.onload = (ev) => {
      const dataUrl = ev.target.result;
      pendingBgData = dataUrl;
      document.getElementById('bgUrlInput').value = '';
      showPreview(dataUrl);
      showToast('Imagen lista. Presiona "Aplicar" para guardar.');
    };
    reader.onerror = () => showToast('Error al leer el archivo', true);
    reader.readAsDataURL(file);
  };
}

// ============================================
// INICIALIZACIÓN
// ============================================
async function init() {
  try {
    db = await openDB();
    await loadBackground();
    await loadCards();
    initEvents();
  } catch (err) {
    console.error(err);
    alert('Error al inicializar la base de datos: ' + err.message);
  }
}

init();

// Exponer funciones globales usadas en onclick
window.editCard = editCard;
window.confirmDelete = confirmDelete;
</script>
